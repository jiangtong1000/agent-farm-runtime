[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-farm-runtime"
version = "0.1.0"
description = "Durable-state-driven runtime for portable research agent farms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
farm = "agent_farm_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
